replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8004

kafka:
  bootstrap: ""

env:
  jwtSecret: ""
  matcher: ""

db:
  path: /data/notification.db


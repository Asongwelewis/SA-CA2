apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helep-ingress
spec:
  rules:
    - host: {{ index .Values "user-service" "ingress" "host" | default "helep.local" }}
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8001
          - path: /api/sos
            pathType: Prefix
            backend:
              service:
                name: sos-service
                port:
                  number: 8002
          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005
